<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C1F24">
<meta name="robots" content="noindex, nofollow">
<title>404 — الصفحة غير موجودة | إدارة خدمات الطريق الدولي</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .err-wrap{
    min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
    background:
      radial-gradient(900px 480px at 10% 6%, rgba(201,166,107,.22), transparent 62%),
      radial-gradient(820px 460px at 92% 96%, rgba(28,31,36,.10), transparent 62%),
      linear-gradient(160deg, #F8F7F3 0%, #EEEEE8 100%);
  }
  .err-card{
    width:100%; max-width:460px; background:var(--surface); border:1px solid var(--border);
    border-radius:22px; box-shadow:var(--shadow-lg); padding:40px 32px;
  }
  .err-card .brand-logo{ height:76px; width:76px; margin:0 auto 16px; }
  .err-code{
    font-family:'Cairo',sans-serif; font-size:56px; font-weight:800; line-height:1;
    color:var(--navy); letter-spacing:-.02em;
  }
  .err-title{ font-family:'Cairo',sans-serif; font-size:18px; font-weight:800; color:var(--navy); margin:10px 0 6px; }
  .err-text{ font-size:13.5px; color:var(--muted); line-height:1.9; margin-bottom:24px; }
  .err-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .err-actions .btn{ width:auto; }
  .err-foot{ margin-top:24px; padding-top:16px; border-top:1px dashed var(--border);
             font-size:11.5px; color:var(--muted); }
  .err-foot strong{ color:var(--navy); }
</style>
</head>
<body>
<div class="err-wrap">
    <div class="err-card">
        <img class="brand-logo" src="{{ url_for('static', filename='logo.svg') }}" alt="شعار إدارة خدمات الطريق الدولي">
        <div class="err-code">404</div>
        <div class="err-title">الصفحة غير موجودة</div>
        <div class="err-text">
            ربما تم نقل الرابط أو حذفه، أو أنك أدخلته بشكل غير صحيح.
            يمكنك العودة إلى لوحة المعلومات أو استخدام القائمة الجانبية للتنقل.
        </div>
        <div class="err-actions">
            <a class="btn" href="{{ url_for('dashboard') }}">العودة للوحة المعلومات</a>
            <a class="btn btn-ghost" href="javascript:history.back()">الرجوع للخلف</a>
        </div>
        <div class="err-foot">
            <strong>إدارة خدمات الطريق الدولي</strong><br>
            Toll Road Services Management
        </div>
    </div>
</div>
</body>
</html>
